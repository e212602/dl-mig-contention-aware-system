---
# =============================================================================
# vLLM + aiperf under a PCIe bandwidth limit.
#
# For every model in models_list, and for every setting (an optional baseline
# without LD_PRELOAD, then each GB_RATE in group_size_values):
#   1. prepare the server (remove controller, Jobs and rate-control files)
#   2. create the vLLM Job (Pending until the controller publishes the ready file)
#   3. create the controller with GB_RATE=<rate>
#   4. run aiperf from the client
#   5. wait until it finishes
#   6. collect aiperf artifacts, scheduler logs and Prometheus/DCGM telemetry
#
# Required env : SERVER_ID, CLIENT_ID  (inventory hosts)
# Optional env : CPU_OFFLOAD_ENABLE=Yes|No   (unset == No)
# Prerequisite : SSH tunnel on the client:  ssh -N -f -L 8080:localhost:80 ubuntu@SERVER_IP
# Files        : vllm_vars.yaml, aiperf_vars.yaml, pcie_sweep_vars.yaml,
#                vllm_pcie_bw_sweep_iteration.yml, collect_metrics_sweep.yml,
#                manifests/vllm_server.yaml.j2, manifests/controller_sweep.yaml.j2,
#                utils/scrapper.go, utils/get_time_boundaries.py
# Results      : ./results/<experiment>_cpuoffload-<on|off>_<timestamp>/<model>/<setting>/
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Controller: validate inputs, create run identity and output directory
# -----------------------------------------------------------------------------
- name: Prepare run (controller)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vllm_vars.yaml
    - aiperf_vars.yaml
    - group_size_sweep_vars.yml
  vars:
    experiment_name: vllm_group_size_sweep
    output_base_dir: "{{ lookup('env', 'PWD') }}/results"
    cpu_offload_env: "{{ lookup('env', 'CPU_OFFLOAD_ENABLE') | lower | trim }}"
    server_goarch: amd64   # GOARCH of the server host (amd64 or arm64)

  tasks:
    - name: Validate environment and variable files
      ansible.builtin.assert:
        that:
          - lookup('env', 'SERVER_ID') | length > 0
          - lookup('env', 'CLIENT_ID') | length > 0
          - cpu_offload_env in ['', 'yes', 'no']
          - models_list | difference(cpu_offload_by_model.keys() | list) | length == 0
          - models_list | difference(model_urls.keys() | list) | length == 0
          - models_list | difference(model_urls_server.keys() | list) | length == 0
          - group_size_values | length > 0 or include_baseline | bool
          - (group_size_values | map('int') | select('gt', 0) | list | length) == (group_size_values | length)
          - rate_control_worker_id | string is match('^[0-9]+$')
          # The URL path of each model names its Service/Ingress/Job, so it must be
          # a unique DNS-style label.
          - "(models_list | map('extract', model_urls_server) | map('urlsplit', 'path') | select('match', '^/[a-z0-9]([-a-z0-9]*[a-z0-9])?/?$') | list | length) == (models_list | length)"
          - "(models_list | map('extract', model_urls_server) | map('urlsplit', 'path') | unique | list | length) == (models_list | length)"
        fail_msg: >-
          Export SERVER_ID and CLIENT_ID, set CPU_OFFLOAD_ENABLE to Yes or No
          (or leave it unset), make sure every model has an entry in
          cpu_offload_by_model, model_urls and model_urls_server, that the URL
          paths in model_urls_server are unique lowercase labels (e.g. /gemma),
          and that group_size_values holds positive integers.

    - name: Resolve CPU offload switch
      ansible.builtin.set_fact:
        cpu_offload_enabled: "{{ cpu_offload_env == 'yes' }}"

    - name: Capture timestamp
      ansible.builtin.set_fact:
        timestamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"

    - name: Set run identity
      ansible.builtin.set_fact:
        run_id: "{{ experiment_name }}_cpuoffload-{{ 'on' if cpu_offload_enabled | bool else 'off' }}_{{ timestamp }}"
        run_dir: "{{ output_base_dir }}/{{ experiment_name }}_cpuoffload-{{ 'on' if cpu_offload_enabled | bool else 'off' }}_{{ timestamp }}"

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ run_dir }}"
        state: directory
        mode: '0755'

    # Fail early if Go is missing, before any experiment time is spent.
    - name: Build scrapper binary for the server
      ansible.builtin.command: go build -o bin/scrapper utils/scrapper.go
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        GOOS: linux
        GOARCH: "{{ server_goarch }}"
        CGO_ENABLED: "0"
      changed_when: false

    - name: Get git commit of this repository
      ansible.builtin.command: git rev-parse HEAD
      args:
        chdir: "{{ playbook_dir }}"
      register: git_commit
      failed_when: false
      changed_when: false

    - name: Write run metadata
      ansible.builtin.copy:
        dest: "{{ run_dir }}/run_metadata.json"
        content: "{{ run_metadata | to_nice_json }}"
        mode: '0644'
      vars:
        run_metadata:
          run_id: "{{ run_id }}"
          timestamp: "{{ timestamp }}"
          git_commit: "{{ git_commit.stdout | default('unknown') }}"
          cpu_offload_enabled: "{{ cpu_offload_enabled | bool }}"
          cpu_offload_by_model: "{{ cpu_offload_by_model }}"
          models: "{{ models_list }}"
          request_rate: "{{ request_rate }}"
          request_count: "{{ request_count }}"
          group_size_values: "{{ group_size_values }}"
          include_baseline: "{{ include_baseline | bool }}"
          burst_ticks: "{{ burst_ticks }}"
          rate_control_worker_id: "{{ rate_control_worker_id }}"
          vllm_extra_args: "{{ vllm_extra_args }}"
          libcuda_log_level: "{{ libcuda_log_level }}"
          continue_on_failure: "{{ continue_on_failure | bool }}"


# -----------------------------------------------------------------------------
# 2. Client: the whole sweep. One play so every iteration can use the client
#    directly; server-side tasks are delegated to the server host.
# -----------------------------------------------------------------------------
- name: Run Group Size sweep (client)
  hosts: "{{ lookup('env', 'CLIENT_ID') }}"
  gather_facts: false
  vars_files:
    - vllm_vars.yaml
    - aiperf_vars.yaml
    - group_size_sweep_vars.yml
  vars:
    server_host: "{{ lookup('env', 'SERVER_ID') }}"
    k8s_namespace: default
    run_id: "{{ hostvars['localhost']['run_id'] }}"
    local_run_dir: "{{ hostvars['localhost']['run_dir'] }}"
    cpu_offload_enabled: "{{ hostvars['localhost']['cpu_offload_enabled'] }}"
    controller_pod_name: controller
    ready_file_name: "ready-ops-{{ rate_control_worker_id }}"
    go_file_name: "go-ops-{{ rate_control_worker_id }}"
    vllm_template_file: "{{ playbook_dir }}/manifests/vllm_server.yaml.j2"
    controller_template_file: "{{ playbook_dir }}/manifests/controller_sweep.yaml.j2"
    # 'baseline' (if enabled) first, then every GB_RATE.
    group_size_settings: "{{ (['baseline'] if include_baseline | bool else []) + group_size_values }}"
    server_ready_retries: 120      # x 10s = 20 minutes for the model to load
    client_run_dir: "/tmp/{{ hostvars['localhost']['run_id'] }}"
    aiperf_bin: "{{ ansible_python_interpreter | dirname }}/aiperf"
    # Confirm with `aiperf profile --help`; change here if the flag differs.
    aiperf_artifact_flag: "--artifact-dir"
    benchmark_timeout_seconds: 7200
    warmup_requests: 5
    # --- system metrics collection ---
    metrics_step: 5s               # must be >= the Prometheus/DCGM scrape interval
    metrics_pad_seconds: 5         # widen each run window on both sides
    prometheus_settle_seconds: 30  # let the last samples be scraped
    prometheus_namespace: monitoring
    prometheus_service: prometheus-operated   # check: kubectl get svc -A | grep -i prometheus
    prometheus_service_port: 9090
    prometheus_local_port: 9090

  tasks:
    - name: Check client prerequisites
      ansible.builtin.assert:
        that: ansible_python_interpreter is defined
        fail_msg: "Set ansible_python_interpreter (venv python) for the client host in the inventory."

    - name: Check aiperf exists
      ansible.builtin.stat:
        path: "{{ aiperf_bin }}"
      register: aiperf_stat
      failed_when: not aiperf_stat.stat.exists

    - name: Create client run directory
      ansible.builtin.file:
        path: "{{ client_run_dir }}"
        state: directory
        mode: '0755'

    - name: Copy time-boundary script to the client
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/utils/get_time_boundaries.py"
        dest: "{{ client_run_dir }}/get_time_boundaries.py"
        mode: '0755'

    - name: Execute the sweep (every model x every setting)
      ansible.builtin.include_tasks: vllm_group_size_sweep_iteration.yml
      loop: "{{ models_list | product(group_size_settings) | list }}"
      loop_control:
        loop_var: run
        label: "{{ run[0] }} / {{ 'baseline' if run[1] | string == 'baseline' else 'group-size-' ~ run[1] }}"
      vars:
        model: "{{ run[0] }}"
        setting: "{{ run[1] }}"

    - name: Remove client run directory
      ansible.builtin.file:
        path: "{{ client_run_dir }}"
        state: absent
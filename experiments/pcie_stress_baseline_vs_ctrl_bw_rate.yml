---
- name: Remove a previous controller pod
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: controller
    namespace: "{{ k8s_namespace }}"
    wait: true
    wait_timeout: 120

- name: Remove previous PCIe worker jobs (and their pods)
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "ops-{{ item.worker_number }}"
    namespace: "{{ k8s_namespace }}"
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: 120
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "ops-{{ item.worker_number }}"

- name: Remove any orphaned PCIe worker pods
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    namespace: "{{ k8s_namespace }}"
    label_selectors:
      - "job-name=ops-{{ item.worker_number }}"
    wait: true
    wait_timeout: 120
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "ops-{{ item.worker_number }}"

- name: Clear all rate-control state
  ansible.builtin.file:
    path: "{{ rate_control_dir }}"
    state: absent
  become: true

- name: Recreate the empty rate-control directory
  ansible.builtin.file:
    path: "{{ rate_control_dir }}"
    state: directory
    mode: "0755"

- name: Remove this experiment's previous result files
  ansible.builtin.file:
    path: "{{ pcie_results_dir }}/ops-v2-worker-{{ item.worker_number }}-bw_control={{ item.bw_control }}.csv"
    state: absent
  become: true
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "worker {{ item.worker_number }} (bw_control={{ item.bw_control }})"

- name: Create local output directory for this rate
  ansible.builtin.file:
    path: "{{ local_run_dir }}/gb_rate-{{ gb_rate }}"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Create the results directory for this iteration on the server
  ansible.builtin.file:
    path: "{{ server_results_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Create PCIe worker jobs
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('ansible.builtin.template', ops_template_file) | from_yaml }}"
  vars:
    worker_number: "{{ item.worker_number }}"
    bw_control: "{{ item.bw_control }}"
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "ops-{{ item.worker_number }} (bw_control={{ item.bw_control }})"

- name: Create PCIe bandwidth controller pod
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace }}"
    definition: "{{ lookup('ansible.builtin.template', controller_template_file) | from_yaml }}"

- name: Wait for all PCIe workers to finish
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "ops-{{ item.worker_number }}"
    namespace: "{{ k8s_namespace }}"
  register: pcie_job_status
  until: >-
    pcie_job_status.resources | length == 1
    and (pcie_job_status.resources[0].status.succeeded | default(0) | int) >= 1
  retries: 360
  delay: 10
  failed_when: >-
    pcie_job_status.resources | length == 1
    and (
      pcie_job_status.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Failed')
      | selectattr('status', 'equalto', 'True')
      | list | length
    ) > 0
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "ops-{{ item.worker_number }}"

- name: Verify each expected PCIe result file exists
  ansible.builtin.stat:
    path: "{{ pcie_results_dir }}/ops-v2-worker-{{ item.worker_number }}-bw_control={{ item.bw_control }}.csv"
  register: pcie_result_files
  failed_when: not pcie_result_files.stat.exists
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "worker {{ item.worker_number }} (bw_control={{ item.bw_control }})"

- name: Collect PCIe results on the local machine
  ansible.builtin.fetch:
    src: "{{ pcie_results_dir }}/ops-v2-worker-{{ item.worker_number }}-bw_control={{ item.bw_control }}.csv"
    dest: "{{ local_run_dir }}/gb_rate-{{ gb_rate }}/"
    flat: true
  loop: "{{ pcie_workers }}"
  loop_control:
    label: "worker {{ item.worker_number }} (bw_control={{ item.bw_control }})"

- name: Check for server results
  ansible.builtin.stat:
    path: "{{ server_results_dir }}"
  become: true
  register: server_results_stat

- name: Compress server results
  ansible.builtin.command:
    cmd: "tar -czf {{ server_results_dir }}.tar.gz -C {{ server_results_dir }} ."
  become: true
  when: server_results_stat.stat.exists

- name: Transfer server results to the controller
  ansible.builtin.fetch:
    src: "{{ server_results_dir }}.tar.gz"
    dest: "{{ local_run_dir }}/gb_rate-{{ gb_rate }}/server_results.tar.gz"
    flat: true
  become: true
  when: server_results_stat.stat.exists

- name: Delete server results of this iteration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ server_results_dir }}"
    - "{{ server_results_dir }}.tar.gz"
  become: true
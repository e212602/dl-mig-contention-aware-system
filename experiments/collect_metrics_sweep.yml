---
# Included at the end of every iteration (adapted from collect_metrics.yml).
# 1. Client : compute the time window of every (rate, count) aiperf run of this
#             iteration from its raw JSONL (start/end time, padded).
# 2. Server : open a kubectl port-forward to Prometheus (localhost only) and run
#             the scrapper once per window.
# The port-forward, tarball and fetch are handled in the iteration's `always`.

- name: Compute the time window of every benchmark run
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ client_run_dir }}/get_time_boundaries.py"
      - --file
      - "{{ iter_client_dir }}/artifacts/{{ setting_name }}/{{ model_tag }}_rps{{ item[0] }}_n{{ item[1] }}/{{ setting_name }}_raw.jsonl"
      - --pad-seconds
      - "{{ metrics_pad_seconds }}"
  loop: "{{ request_rate | product(request_count) | list }}"
  loop_control:
    label: "{{ setting_name }} / {{ model }} rps={{ item[0] }} n={{ item[1] }}"
  register: time_windows
  changed_when: false

- name: Save time windows to the controller
  ansible.builtin.copy:
    dest: "{{ iter_local_dir }}/time_windows.json"
    content: "{{ time_windows.results | map(attribute='stdout') | map('from_json') | list | to_nice_json }}"
    mode: '0644'
  delegate_to: localhost

- name: Let Prometheus ingest the final samples
  ansible.builtin.pause:
    seconds: "{{ prometheus_settle_seconds }}"

- name: Create metrics directory on the server
  ansible.builtin.file:
    path: "{{ iter_metrics_dir }}"
    state: directory
    mode: '0755'
  delegate_to: "{{ server_host }}"

- name: Copy scrapper binary to the server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/bin/scrapper"
    dest: "{{ iter_metrics_dir }}/scrapper"
    mode: '0755'
  delegate_to: "{{ server_host }}"

- name: Start Prometheus port-forward on the server (background)
  ansible.builtin.command:
    argv:
      - kubectl
      - port-forward
      - --namespace
      - "{{ prometheus_namespace }}"
      - "svc/{{ prometheus_service }}"
      - --address
      - 127.0.0.1
      - "{{ prometheus_local_port }}:{{ prometheus_service_port }}"
  async: 3600
  poll: 0
  delegate_to: "{{ server_host }}"

- name: Wait until Prometheus answers through the port-forward
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ prometheus_local_port }}/-/ready"
    status_code: 200
    timeout: 3
  register: prom_ready
  until: prom_ready.status is defined and prom_ready.status == 200
  retries: 15
  delay: 2
  delegate_to: "{{ server_host }}"

- name: Scrape Prometheus for every run window
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ iter_metrics_dir }}
    ./scrapper \
      --addr "http://127.0.0.1:{{ prometheus_local_port }}" \
      --start "{{ window.start }}" \
      --end "{{ window.end }}" \
      --step "{{ metrics_step }}" \
      --csv-file "{{ run_tag }}.csv" > "{{ run_tag }}.log" 2>&1
    # The scrapper exits 0 even when individual queries fail, so check the log.
    if grep -q 'ERROR:' "{{ run_tag }}.log"; then
      echo "Prometheus queries failed for {{ run_tag }}, see {{ iter_metrics_dir }}/{{ run_tag }}.log" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  vars:
    window: "{{ item.stdout | from_json }}"
    run_tag: "{{ setting_name }}__{{ model_tag }}_rps{{ item.item[0] }}_n{{ item.item[1] }}"
  loop: "{{ time_windows.results }}"
  loop_control:
    label: "{{ setting_name }} / {{ model }} rps={{ item.item[0] }} n={{ item.item[1] }}"
  delegate_to: "{{ server_host }}"
  changed_when: true

- name: Stop Prometheus port-forward
  ansible.builtin.command:
    argv: [pkill, -f, "kubectl port-forward.*{{ prometheus_local_port }}:{{ prometheus_service_port }}"]
  delegate_to: "{{ server_host }}"
  failed_when: false
  changed_when: false

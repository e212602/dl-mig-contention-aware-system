experiment_name: vllm_vs_pcie

vllm_servers_list:
  - model_id: "bigscience/bloom-1b7"
    slug: "bloom-1b7"
    source_manifest: "workload/vllm/model_Server/openai-vllm-bloom-1b7.yaml"
    url_path: "/"
    cpu: "10"
    memory: "8Gi"
    args:
      - "--model"
      - "$(MODEL_NAME)"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "4096"
      - "--async-scheduling"
      - "--limit-mm-per-prompt.video"
      - "0"
      - "--no-enable-prefix-caching"
      - "--gpu_memory_utilization"
      - "0.9"
    extra_env: []
  - model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

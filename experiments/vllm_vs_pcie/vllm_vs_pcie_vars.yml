    cpu: "10"
    memory: "16Gi"
    args:
      - "--model"
      - "$(MODEL_NAME)"
      - "--tensor-parallel-size"
      - "1"
      - "--max-model-len"
      - "32768"
      - "--async-scheduling"
      - "--limit-mm-per-prompt.video"
      - "0"
      - "--no-enable-prefix-caching"

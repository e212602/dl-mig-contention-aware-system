bw_values: [1, 2, 4, 8, 16]
num_pcie_stress_workers_values: [1, 2, 3]
bw_pcie_stress_values: [1, 2, 4, 8, 16]

request_rate: 10
request_count: 200
warmup_requests: 5
aiperf_warmup_request_count: 20
benchmark_timeout_seconds: 7200
server_ready_retries: 120

k8s_namespace: default
controller_image: "e8113/controller:latest"
pcie_stress_image: "e8113/pcie_test"
vllm_image: "docker.io/vllm/vllm-openai:latest"
vllm_image_pull_policy: Never
rate_control_dir: "/home/ubuntu/work/projects/dl-mig-contention-aware-system/rate-control"
vgpu_library_host_path: "/home/ubuntu/work/projects/dl-mig-contention-aware-system/HAMi-core/build"
hf_cache_host_path: "/home/ubuntu/.cache/huggingface"
server_results_root: "/tmp/results"
server_metrics_root: "/tmp/results/vllm_vs_pcie_metrics"
prometheus_namespace: monitoring
prometheus_service: prometheus-operated
prometheus_service_port: 9090
prometheus_local_port: 19090
prometheus_step: 5s
prometheus_pad_seconds: 5
prometheus_settle_seconds: 30

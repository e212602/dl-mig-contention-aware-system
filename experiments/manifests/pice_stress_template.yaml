apiVersion: batch/v1
kind: Job
metadata:
  name: ops-{{ .Values.worker_number }}
spec:
  parallelism: 1
  template:
    spec:
      initContainers:
        - name: wait-for-controller
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for rate-control file to be initialized..."
              until [ -f /tmp/rate-control/ready-ops-1 ]; do
                echo "not ready yet, sleeping..."
                sleep 1
              done
              echo "Controller is ready."
          volumeMounts:
            - mountPath: /tmp/rate-control
              name: rate-control
      containers:
        - name: ops
          image: e8113/pcie_test
          env:
            # Only set LD_PRELOAD if bw_control is equal to "on"
            {{- if ne .Values.bw_control "on" }}
            - name: LD_PRELOAD
              value: "/mnt/libvgpu.so"
            {{- end }}
            - name: SHARED_REGION_CACHE_ENV
              value: "/tmp/rate-control/rate-control-ops-1"
            - name: LIBCUDA_LOG_LEVEL
              value: "0"
            - name: PCIE_RESULTS_CSV
              value: "/tmp/results/ops-v2-worker-{{ .Values.worker_number }}-bw_control={{ .Values.bw_control }}.csv"
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - mountPath: /mnt
              name: vgpu
              readOnly: true
            - mountPath: /tmp/rate-control
              name: rate-control
              readOnly: false
            - mountPath: /tmp/results
              name: results
              readOnly: false
          imagePullPolicy: Never
      restartPolicy: Never
      volumes:
        - name: vgpu
          hostPath:
            path: /home/ubuntu/work/projects/dl-mig-contention-aware-system/HAMi-core/build
            type: Directory
        - name: rate-control
          hostPath:
            path: /home/ubuntu/work/projects/dl-mig-contention-aware-system/rate-control
            type: DirectoryOrCreate
        - name: results
          hostPath:
            path: /tmp/results
            type: DirectoryOrCreate
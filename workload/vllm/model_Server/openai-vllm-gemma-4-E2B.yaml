apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-server-gemma-4-e2b
  labels:
    app.kubernetes.io/name: vllm-server-gemma-4-e2b
spec:
  parallelism: 1
  template:
    spec:
      containers:
      - name: vllm-server-gemma-4-e2b
        # command: ["/bin/bash"]
        args: 
        - "--model"
        - "$(MODEL_NAME)"
        - "--tensor-parallel-size"
        - "1"
        - "--max-model-len"
        - "1024"
        - "--async-scheduling"
        - "--limit-mm-per-prompt.video"
        - "0"   
        - "--no-enable-prefix-caching"
        - "--cpu-offload-gb" 
        - "0.1"
        # - "--kv-offloading-size"
        # - "8"
        - "--gpu_memory_utilization"
        - "0.9"
        env:
        - name: MODEL_NAME
          value: "RedHatAI/gemma-2-2b-it-quantized.w4a16"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: HF_TOKEN
        - name: HF_HOME
          value: "/root/.cache/huggingface/"
        image: docker.io/vllm/vllm-openai:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: '5'
            memory: 16Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '5'
            memory: 16Gi
            nvidia.com/gpu: 1
        stdin: true
        tty: true
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache
        - mountPath: /dev/shm
          name: dshm
        ports:
          - containerPort: 8000
            name: gemma-4e2b
      restartPolicy: Never
      volumes:
      - name: hf-cache
        hostPath:
          path: /home/ubuntu/.cache/huggingface
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi   # see below
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service-gemma-4-e2b
spec:
  selector:
    job-name: vllm-server-gemma-4-e2b
  ports:
  - name: gemma-4e2b
    protocol: TCP
    port: 8000
    targetPort: gemma-4e2b
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-ingress-gemma-4-e2b
  annotations:
    haproxy-ingress.github.io/ssl-redirect: "false"
    haproxy-ingress.github.io/timeout-connect: "15s"
    haproxy-ingress.github.io/timeout-server: "1000s"
    haproxy-ingress.github.io/timeout-client: "1000s"
    haproxy-ingress.github.io/rewrite-target: /
    
    # CRITICAL: Disables response buffering so SSE/chunked streams flush immediately
    haproxy-ingress.github.io/response-buffering: "false"
    
    # Prevents client/server idle timeouts during slow initial TTFT (Time To First Token)
    haproxy-ingress.github.io/timeout-queue: "1000s"
spec:
  ingressClassName: haproxy
  rules:
  - host: localhost # Replace with your domain or IP host
    http:
      paths:
      - path: /gemma
        pathType: Prefix
        backend:
          service:
            name: vllm-service-gemma-4-e2b
            port:
              number: 8000
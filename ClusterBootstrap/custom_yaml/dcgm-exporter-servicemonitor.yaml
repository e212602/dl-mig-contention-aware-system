apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-dcgm-exporter
  namespace: gpu-operator
  labels:
    app: gpu-operator          # matches Prometheus serviceMonitorSelector
spec:
  endpoints:
  - path: /metrics
    port: gpu-metrics           # matches spec.ports[0].name in the Service
  namespaceSelector:
    matchNames:
    - gpu-operator
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter # matches Service labels

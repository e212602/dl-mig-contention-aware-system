apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-k8s-discovery-binding
  namespace: gpu-operator # <-- Created in the target namespace
subjects:
- kind: ServiceAccount
  name: prometheus-k8s
  namespace: monitoring   # <-- Points back to where your Prometheus actually lives
roleRef:
  kind: Role
  name: prometheus-k8s-discovery # <-- Links to the local Role above
  apiGroup: rbac.authorization.k8s.io
